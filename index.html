<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>icon-crash — malformed icon metadata</title>

    <!--
      THE ENTIRE TEST CASE IS THESE THREE LINES.

      The page declares icon files that were never shipped, so all three URLs
      return a non-200. This is the default shape a v0.app / Next.js
      `metadata.icons` block emits when the generated icons are missing from
      /public.

      Do not add these files. Shipping them removes the test case.
    -->
    <link rel="icon" href="/icon-light-32x32.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/icon-dark-32x32.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/apple-icon.png" />

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 0.5rem;
        background: #000;
        color: #fff;
        font: 16px/1.4 system-ui, sans-serif;
        text-align: center;
      }
      code { color: #9ad; }
    </style>
  </head>
  <body>
    <h1>icon-crash</h1>
    <p>Icon metadata points at files that 404.</p>
    <p><code>/icon-light-32x32.png</code></p>
  </body>
</html>
